# Example: Codacy Issue Sync caller workflow
#
# Copy this file to .github/workflows/codacy-sync.yml in your repository.
# No other changes are needed in the target repository.
#
# Prerequisites:
#   - The organisation secrets CODACY_API_TOKEN and NEON_DATABASE_URL must
#     exist and be accessible to this repository (GitHub → Organisation
#     Settings → Secrets → Actions).
#   - The repository's workflow permissions must allow issues: write
#     (Settings → Actions → General → Workflow permissions → Read and write).
#
# Documentation:
#   https://github.com/TransactionProcessing/org-ci-workflows/blob/main/docs/sync-codacy-issues.md

name: Codacy Issue Sync

on:
  schedule:
    # Run at 06:00 UTC every weekday (Monday – Friday)
    - cron: "0 6 * * 1-5"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    uses: TransactionProcessing/org-ci-workflows/.github/workflows/sync-codacy-issues.yml@main
    # Automatically forwards all organisation and repository secrets,
    # including CODACY_API_TOKEN and NEON_DATABASE_URL, to the reusable workflow.
    secrets: inherit
    # ── Optional inputs (shown with their defaults) ──────────────────────────
    # Remove or comment out any lines you don't need to customise.
    with:
      # Codacy organisation slug (default: the calling repo's owner)
      # codacy_org: "TransactionProcessing"

      # Codacy repository slug (default: the calling repo's name)
      # codacy_repo: "my-service"

      # Severity levels to sync (default: all three levels)
      # severity_filter: "Error,Warning,Info"

      # Extra labels added to every synced issue (default: none)
      # extra_labels: "needs-triage"

      # GitHub usernames to assign to every new issue (default: none)
      # assignees: "alice,bob"

      # Preview mode – log actions without writing to GitHub (default: false)
      # dry_run: false
