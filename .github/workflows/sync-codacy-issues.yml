name: Sync Codacy Issues

on:
  workflow_call:
    inputs:
      codacy_org:
        required: false
        type: string
        default: ""
      codacy_repo:
        required: false
        type: string
        default: ""
      dry_run:
        required: false
        type: boolean
        default: false
      severity_filter:
        required: false
        type: string
        default: "Error,High,Warning,Info"
      extra_labels:
        required: false
        type: string
        default: ""
      assignees:
        required: false
        type: string
        default: ""

    secrets:
      CODACY_API_TOKEN:
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest

    concurrency:
      group: codacy-sync-${{ github.repository }}
      cancel-in-progress: false

    permissions:
      issues: write
      contents: read

    steps:
      - name: Sync Codacy → GitHub
        uses: actions/github-script@v7
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          CODACY_ORG: ${{ inputs.codacy_org }}
          CODACY_REPO: ${{ inputs.codacy_repo }}
          EXTRA_LABELS: ${{ inputs.extra_labels }}
          ASSIGNEES: ${{ inputs.assignees }}
          SEVERITY_FILTER: ${{ inputs.severity_filter }}
        with:
          github-token: ${{ github.token }}
          script: |
            const https = require('https');
            const path = require('path');

            const token = process.env.CODACY_API_TOKEN;
            const dryRun = process.env.DRY_RUN === 'true';

            const org = process.env.CODACY_ORG || context.repo.owner;
            const repoName = process.env.CODACY_REPO || context.repo.repo;

            const extraLabels = (process.env.EXTRA_LABELS || "")
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);

            const assignees = (process.env.ASSIGNEES || "")
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);

            const severities = (process.env.SEVERITY_FILTER || "")
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);

            const { owner, repo } = context.repo;

            if (!token) throw new Error("Missing CODACY_API_TOKEN");

            // ─────────────────────────────────────────────
            // Codacy API
            // ─────────────────────────────────────────────
            function codacyPost(path, body) {
              return new Promise((resolve, reject) => {
                const payload = JSON.stringify(body);

                const req = https.request({
                  hostname: "app.codacy.com",
                  path,
                  method: "POST",
                  headers: {
                    "api-token": token,
                    "content-type": "application/json",
                    "content-length": Buffer.byteLength(payload)
                  }
                }, res => {
                  let data = "";

                  res.on("data", c => data += c);

                  res.on("end", () => {
                    if (res.statusCode >= 200 && res.statusCode < 300) {
                      return resolve(JSON.parse(data));
                    }
                    reject(new Error(data));
                  });
                });

                req.on("error", reject);
                req.write(payload);
                req.end();
              });
            }

            async function fetchCodacyIssues() {
              const api = `/api/v3/analysis/organizations/gh/${org}/repositories/${repoName}/issues/search`;

              const res = await codacyPost(api, {
                limit: 100,
                levels: severities
              });

              return res.data || [];
            }

            // ─────────────────────────────────────────────
            // GitHub helpers (SOURCE OF TRUTH = LABEL)
            // ─────────────────────────────────────────────
            async function getAllCodacyIssuesFromGitHub() {
              const issues = await github.paginate(
                github.rest.issues.listForRepo,
                {
                  owner,
                  repo,
                  state: "all",
                  labels: "codacy",
                  per_page: 100
                }
              );

              const map = new Map();

              for (const issue of issues) {
                const label = issue.labels.find(l => l.name.startsWith("codacy:"));
                if (!label) continue;

                const id = label.name.replace("codacy:", "");
                map.set(id, issue);
              }

              return map;
            }

            function makeLabel(issueId) {
              return `codacy:${issueId}`;
            }

            function mapSeverity(p) {
              const s = (p?.severityLevel || "").toLowerCase();
              if (s.includes("high") || s.includes("error")) return "bug";
              if (s.includes("warning")) return "warning";
              return "codacy";
            }

            function buildCodacyIssueUrl(ci) {
              return `https://app.codacy.com/gh/${org}/${repoName}/issues/${ci.issueId}`;
            }

            function getCodeSnippet(ci) {
              const candidates = [
                ci.codeSnippet,
                ci.snippet,
                ci.patternInfo?.codeSnippet,
                ci.location?.codeSnippet,
                ci.location?.snippet
              ];

              return candidates.find(
                value => typeof value === "string" && value.trim().length > 0
              )?.trim();
            }

            function getSnippetLanguage(filePath) {
              if (!filePath) {
                return "";
              }

              const fileName = path.basename(filePath || "");
              const dotIndex = fileName.lastIndexOf(".");

              if (dotIndex < 0 || dotIndex === fileName.length - 1) {
                return "";
              }

              if (fileName.startsWith(".") && dotIndex === 0) {
                return "";
              }

              const ext = fileName.slice(dotIndex + 1).toLowerCase();
              const map = {
                js: "javascript",
                jsx: "javascript",
                mjs: "javascript",
                cjs: "javascript",
                ts: "typescript",
                tsx: "typescript",
                py: "python",
                rb: "ruby",
                go: "go",
                java: "java",
                kt: "kotlin",
                kts: "kotlin",
                rs: "rust",
                php: "php",
                sh: "bash",
                bash: "bash",
                zsh: "bash",
                ps1: "powershell",
                yml: "yaml",
                yaml: "yaml",
                json: "json",
                md: "markdown",
                html: "html",
                htm: "html",
                css: "css",
                scss: "scss",
                sql: "sql",
                xml: "xml",
                scala: "scala",
                cs: "csharp",
                cpp: "cpp",
                cxx: "cpp",
                cc: "cpp",
                h: "c",
                hpp: "cpp",
                swift: "swift",
                dart: "dart",
                lua: "lua",
                toml: "toml"
              };

              return map[ext] || "";
            }

            function buildBody(ci) {
              const snippet = getCodeSnippet(ci);
              const snippetLanguage = getSnippetLanguage(ci.filePath);

              const body = [
                `**Codacy Issue ID:** ${ci.issueId}`,
                `**Codacy Issue:** ${buildCodacyIssueUrl(ci)}`,
                "",
                `File: ${ci.filePath}`,
                `Line: ${ci.lineNumber}`,
                "",
                `Message: ${ci.message}`,
                "",
                `Rule: ${ci.patternInfo?.id || "unknown"}`,
                `Severity: ${ci.patternInfo?.severityLevel || "unknown"}`
              ];

              if (snippet) {
                body.push(
                  "",
                  "Code snippet:",
                  `\`\`\`${snippetLanguage}`,
                  snippet,
                  "```"
                );
              }

              return body.join("\n");
            }

            // ─────────────────────────────────────────────
            // Main
            // ─────────────────────────────────────────────
            const codacyIssues = await fetchCodacyIssues();
            const existingMap = await getAllCodacyIssuesFromGitHub();

            const active = new Set(codacyIssues.map(x => x.issueId));

            const stats = { created: 0, updated: 0, closed: 0, cleaned: 0 };

            // CREATE / UPDATE
            for (const ci of codacyIssues) {
              const id = ci.issueId;

              const title = `[Codacy] ${ci.message}`;
              const body = buildBody(ci);

              const existing = existingMap.get(id);

              const labels = [
                "codacy",
                makeLabel(id),
                mapSeverity(ci.patternInfo),
                ...extraLabels
              ];

              if (!existing) {
                if (!dryRun) {
                  await github.rest.issues.create({
                    owner,
                    repo,
                    title,
                    body,
                    labels,
                    assignees
                  });
                }
                stats.created++;
              } else {
                const needsUpdate =
                  existing.title !== title ||
                  existing.body !== body;

                if (needsUpdate && !dryRun) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: existing.number,
                    title,
                    body,
                    labels,
                    state: "open"
                  });
                }

                stats.updated++;
              }
            }

            // CLOSE + CLEANUP (single pass, no extra API calls)
            for (const [id, issue] of existingMap.entries()) {

              if (active.has(id)) continue;

              const hasCodacyLabel =
                (issue.labels || []).some(l =>
                  l.name.startsWith("codacy:")
                );

              if (!dryRun) {

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: "closed"
                });

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: [
                    "🤖 Auto-closed: no longer present in Codacy report.",
                    "",
                    `Last Codacy issueId: ${id}`
                  ].join("\n")
                });

                // remove ONLY codacy:<id>, keep general "codacy"
                if (hasCodacyLabel) {
                  const remainingLabels = (issue.labels || [])
                    .map(l => l.name)
                    .filter(name =>
                      name !== "codacy" &&
                      !name.startsWith("codacy:")
                    );

                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issue.number,
                    labels: remainingLabels
                  });

                  stats.cleaned++;
                }
              }

              stats.closed++;
            }

            console.log(stats);
