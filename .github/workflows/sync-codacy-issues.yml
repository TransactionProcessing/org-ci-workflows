name: Sync Codacy Issues

on:
  workflow_call:
    inputs:
      codacy_org:
        required: false
        type: string
        default: ""
      codacy_repo:
        required: false
        type: string
        default: ""
      dry_run:
        required: false
        type: boolean
        default: false
      severity_filter:
        required: false
        type: string
        default: "Error,High,Warning,Info"
      extra_labels:
        required: false
        type: string
        default: ""
      assignees:
        required: false
        type: string
        default: ""

    secrets:
      CODACY_API_TOKEN:
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest

    concurrency:
      group: codacy-sync-${{ github.repository }}
      cancel-in-progress: false

    permissions:
      issues: write
      contents: read

    steps:
      - name: Sync Codacy → GitHub
        uses: actions/github-script@v7
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          CODACY_ORG: ${{ inputs.codacy_org }}
          CODACY_REPO: ${{ inputs.codacy_repo }}
          EXTRA_LABELS: ${{ inputs.extra_labels }}
          ASSIGNEES: ${{ inputs.assignees }}
          SEVERITY_FILTER: ${{ inputs.severity_filter }}
        with:
          github-token: ${{ github.token }}
          script: |
            const https = require('https');

            const token = process.env.CODACY_API_TOKEN;
            const dryRun = process.env.DRY_RUN === 'true';

            const org = process.env.CODACY_ORG || context.repo.owner;
            const repoName = process.env.CODACY_REPO || context.repo.repo;

            const extraLabels = (process.env.EXTRA_LABELS || "")
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);

            const assignees = (process.env.ASSIGNEES || "")
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);

            const severities = (process.env.SEVERITY_FILTER || "")
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);

            const { owner, repo } = context.repo;

            if (!token) throw new Error("Missing CODACY_API_TOKEN");

            // ─────────────────────────────────────────────
            // Codacy API
            // ─────────────────────────────────────────────
            function codacyPost(path, body) {
              return new Promise((resolve, reject) => {
                const payload = JSON.stringify(body);

                const req = https.request({
                  hostname: "app.codacy.com",
                  path,
                  method: "POST",
                  headers: {
                    "api-token": token,
                    "content-type": "application/json",
                    "content-length": Buffer.byteLength(payload)
                  }
                }, res => {
                  let data = "";

                  res.on("data", c => data += c);

                  res.on("end", () => {
                    if (res.statusCode >= 200 && res.statusCode < 300) {
                      return resolve(JSON.parse(data));
                    }
                    reject(new Error(data));
                  });
                });

                req.on("error", reject);
                req.write(payload);
                req.end();
              });
            }

            async function fetchCodacyIssues() {
              const api = `/api/v3/analysis/organizations/gh/${org}/repositories/${repoName}/issues/search`;

              const res = await codacyPost(api, {
                limit: 100,
                levels: severities
              });

              return res.data || [];
            }

            // ─────────────────────────────────────────────
            // GitHub helpers (SOURCE OF TRUTH = LABEL)
            // ─────────────────────────────────────────────
            async function getAllCodacyIssuesFromGitHub() {
              const issues = await github.paginate(
                github.rest.issues.listForRepo,
                {
                  owner,
                  repo,
                  state: "all",
                  labels: "codacy",
                  per_page: 100
                }
              );

              const map = new Map();

              for (const issue of issues) {
                const label = issue.labels.find(l => l.name.startsWith("codacy:"));
                if (!label) continue;

                const id = label.name.replace("codacy:", "");
                map.set(id, issue);
              }

              return map;
            }

            function makeLabel(issueId) {
              return `codacy:${issueId}`;
            }

            function mapSeverity(p) {
              const s = (p?.severityLevel || "").toLowerCase();
              if (s.includes("high") || s.includes("error")) return "bug";
              if (s.includes("warning")) return "warning";
              return "codacy";
            }

            function buildBody(ci) {
              return [
                `**Codacy Issue ID:** ${ci.issueId}`,
                "",
                `File: ${ci.filePath}`,
                `Line: ${ci.lineNumber}`,
                "",
                `Message: ${ci.message}`,
                "",
                `Rule: ${ci.patternInfo?.id || "unknown"}`,
                `Severity: ${ci.patternInfo?.severityLevel || "unknown"}`
              ].join("\n");
            }

            // ─────────────────────────────────────────────
            // Main
            // ─────────────────────────────────────────────
            const codacyIssues = await fetchCodacyIssues();
            const existingMap = await getAllCodacyIssuesFromGitHub();

            const active = new Set(codacyIssues.map(x => x.issueId));

            const stats = { created: 0, updated: 0, closed: 0 };

            // CREATE / UPDATE
            for (const ci of codacyIssues) {
              const id = ci.issueId;

              const title = `[Codacy] ${ci.message}`;
              const body = buildBody(ci);

              const label = makeLabel(id);
              const existing = existingMap.get(id);

              const labels = [
                "codacy",
                label,
                mapSeverity(ci.patternInfo),
                ...extraLabels
              ];

              if (!existing) {
                if (!dryRun) {
                  await github.rest.issues.create({
                    owner,
                    repo,
                    title,
                    body,
                    labels,
                    assignees
                  });
                }
                stats.created++;
              } else {
                const needsUpdate =
                  existing.title !== title ||
                  existing.body !== body;

                if (needsUpdate && !dryRun) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: existing.number,
                    title,
                    body,
                    labels,
                    state: "open"
                  });
                }

                stats.updated++;
              }
            }

            // CLOSE STALE
            for (const [id, issue] of existingMap.entries()) {
              if (!active.has(id)) {
                if (!dryRun) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issue.number,
                    state: "closed"
                  });

                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: "Auto-closed: no longer present in Codacy report."
                  });
                }

                stats.closed++;
              }
            }

            console.log(stats);
