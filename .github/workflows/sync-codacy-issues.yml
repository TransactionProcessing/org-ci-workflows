name: Sync Codacy Issues

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Run without creating or modifying GitHub issues"
        required: false
        default: false
        type: boolean
    secrets:
      GH_TOKEN:
        required: true
      CODACY_API_TOKEN:
        required: true

jobs:
  sync-codacy:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq gh

      # STEP 1: Fetch all Codacy issues (with explicit unlimited paging)
      - name: Fetch Codacy Issues
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          curl --request POST \
            --url "https://app.codacy.com/api/v3/analysis/organizations/gh/${{ github.repository_owner }}/repositories/${{ github.event.repository.name }}/issues/search" \
            --header "api-token: $CODACY_API_TOKEN" \
            --header "content-type: application/json" \
            --data '{"levels":["Error","Warning","High"],"limit":10000}' \
            --silent \
            --fail \
            -o codacy_issues.json

      # STEP 2: Ensure standard labels exist
      - name: Ensure standard labels exist
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          declare -A LABELS=(
            ["task"]="#aefcde Tasks and work items"
            ["refactor"]="#eb69a2 Code cleanup and best practices"
            ["bug"]="#b60205 Bugs and error-prone code"
            ["security"]="#d93f0b Security-related issues"
            ["performance"]="#e57504 Performance optimization issues"
          )

          for label in "${!LABELS[@]}"; do
            color=$(echo "${LABELS[$label]}" | awk '{print $1}')
            description=$(echo "${LABELS[$label]}" | cut -d' ' -f2-)

            gh label create "$label" \
              --color "$color" \
              --description "$description" \
              --repo ${{ github.repository }} \
              --force || true
          done

      # STEP 3: Sync issues
      - name: Sync Codacy Issues
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Fetch ALL open issues (unlimited)
          current_issues=$(gh issue list --limit 5000 --state open --repo ${{ github.repository }} --json number,title,body,labels)

          jq -c '.data[]' codacy_issues.json | while read -r issue; do
            id=$(echo "$issue" | jq -r '.issueId')
            file=$(echo "$issue" | jq -r '.filePath')
            line=$(echo "$issue" | jq -r '.lineNumber')
            message=$(echo "$issue" | jq -r '.message')
            line_text=$(echo "$issue" | jq -r '.lineText // empty')
            category=$(echo "$issue" | jq -r '.patternInfo.category')
            severity=$(echo "$issue" | jq -r '.patternInfo.severityLevel')
            sha=$(echo "$issue" | jq -r '.commitInfo.sha')

            clean_line_text=$(echo "$line_text" | tr -d '\r' | tr '\n' ' ')

            # Label detection
            category_lower=$(echo "$category" | tr '[:upper:]' '[:lower:]')
            message_lower=$(echo "$message" | tr '[:upper:]' '[:lower:]')

            if echo "$message_lower" | grep -q "todo"; then
              label="task"
            elif [[ "$category_lower" =~ (bug|error|errorprone|error-prone|error_prone) ]]; then
              label="bug"
            elif [[ "$category_lower" =~ security ]]; then
              label="security"
            elif [[ "$category_lower" =~ performance ]]; then
              label="performance"
            elif [[ "$category_lower" =~ (refactor|best[._ ]?practice|code[._ ]?style|complexity|unused[._ ]?code) ]]; then
              label="refactor"
            else
              label=""
            fi

            title="[$category] $message"

            # Body (stable formatting + hidden machine tag)
            body="<!-- CODACY-ID:$id -->

            **Codacy ID:** \`$id\`

            **File:** \`$file\`
            **Line:** $line
            **Rule:** $category ($severity)
            **Commit:** \`$sha\`
            
            **Message:** $message
            "

            if [ -n "$clean_line_text" ]; then
              body+="
            **Code Snippet:**
            \`\`\`csharp
            $clean_line_text
            \`\`\`
            "
            fi

            tmpfile=$(mktemp)
            echo "$body" > "$tmpfile"

            # Find existing issue via hidden marker
            existing_number=$(echo "$current_issues" | jq -r --arg id "$id" '
              .[] | select(.body | contains("CODACY-ID:" + $id)) | .number
            ')

            if [ -n "$existing_number" ]; then
                echo "Updating issue #$existing_number"
                if [ "$DRY_RUN" != "true" ]; then
                    # Apply update
                    gh issue edit "$existing_number" \
                      --body-file "$tmpfile" \
                      --remove-label '*' \
                      --add-label "$label" \
                      --repo ${{ github.repository }}
                else
                    echo "[DRY RUN] Would update #$existing_number"
                fi
            else
                echo "Creating new issue for $id"
                if [ "$DRY_RUN" != "true" ]; then
                    gh issue create \
                      --title "$title" \
                      --label "$label" \
                      --body-file "$tmpfile" \
                      --repo ${{ github.repository }}
                else
                    echo "[DRY RUN] Would create new issue"
                fi
            fi

            rm "$tmpfile"
          done

      # STEP 4: Close resolved issues
      - name: Close resolved issues
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # List ALL open GitHub issues
          gh issue list --limit 5000 --state open --repo ${{ github.repository }} --json number,body \
            | jq -c '.[]' \
            | while read -r issue; do

              number=$(echo "$issue" | jq -r '.number')
              body=$(echo "$issue" | jq -r '.body')

              # Extract reliable Codacy ID via hidden tag
              id=$(echo "$body" | sed -n 's/.*CODACY-ID:\([a-zA-Z0-9_-]\+\).*/\1/p')

              [ -z "$id" ] && continue

              # Check if ID exists in latest Codacy report
              if ! jq -r '.data[].issueId' codacy_issues.json | grep -q "$id"; then
                echo "Closing stale issue #$number (ID=$id)"
                if [ "$DRY_RUN" != "true" ]; then
                  gh issue close "$number" \
                    --comment "This issue no longer appears in Codacy reports and has been auto-closed." \
                    --repo ${{ github.repository }}
                else
                  echo "[DRY RUN] Would close #$number"
                fi
              fi
            done
