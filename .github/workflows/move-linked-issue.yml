name: Move Linked Issue in Project

on:
  workflow_call:
    inputs:
      org:
        required: true
        type: string
    secrets:
      gh_token:
        required: true

jobs:
  move_issue:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install latest GitHub CLI
        run: |
          curl -sSL https://github.com/cli/cli/releases/latest/download/gh_$(curl -sSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name | sed 's/^v//')_linux_amd64.tar.gz -o gh.tar.gz
          tar -xzf gh.tar.gz
          sudo cp gh_*/bin/gh /usr/local/bin/
          gh --version

      - name: Fetch linked issues
        id: get_linked_issues
        run: |
          echo "Fetching linked issues..."
          ISSUE_NUMBERS=$(gh pr view ${{ github.event.pull_request.number }} --json linkedIssues -q ".linkedIssues[].number" || echo "")
          
          #echo "issue_numbers=${ISSUE_NUMBERS}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Skip if no linked issues
        if: steps.get_linked_issues.outputs.issue_numbers == ''
        run: echo "No linked issues found. Skipping."

      - name: Get project, field, and option IDs
        if: steps.get_linked_issues.outputs.issue_numbers != ''
        id: project_info
        run: |
          echo "Getting project ID..."
          PROJECT_ID=$(gh project list --owner ${{ inputs.org }} --format json -L 10 | jq -r '[.[] | select(.title | test("Sprint$"))] | sort_by(.title) | last | .id')
          echo "project_id=${PROJECT_ID}" >> $GITHUB_OUTPUT

          FIELD_ID=$(gh project field-list $PROJECT_ID --format json | jq -r '.[] | select(.name == "Status") | .id')
          echo "field_id=${FIELD_ID}" >> $GITHUB_OUTPUT

          OPTION_ID=$(gh project field-list $PROJECT_ID --format json | jq -r '.[] | select(.name == "Status") | .options[] | select(.name == "In Review") | .id')
          echo "option_id=${OPTION_ID}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Move each linked issue to In Progress
        if: steps.get_linked_issues.outputs.issue_numbers != ''
        run: |
          for issue in ${{ steps.get_linked_issues.outputs.issue_numbers }}; do
            echo "Processing issue: $issue"

            ITEM_ID=$(gh project item-list ${{ steps.project_info.outputs.project_id }} --owner ${{ inputs.org }} --format json | jq -r --arg issueId "$issue" '.[] | select(.content.number | tostring == $issueId) | .id')

            if [ -z "$ITEM_ID" ]; then
              echo "No project item found for issue #$issue. Skipping."
              continue
            fi

            echo "Updating issue #$issue (item ID: $ITEM_ID)..."
            gh project item-update ${{ steps.project_info.outputs.project_id }} --id "$ITEM_ID" --field-id ${{ steps.project_info.outputs.field_id }} --option-id ${{ steps.project_info.outputs.option_id }}
          done
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
