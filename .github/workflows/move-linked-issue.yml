name: Move Linked Issues to Project Column

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      project_column_name:
        required: true
        type: string
      project_name_prefix:
        required: false
        default: ''
        type: string
    secrets:
      gh_token:
        required: true

jobs:
  move-linked-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2

      - name: Install GitHub CLI
        run: |
          curl -sSL https://github.com/cli/cli/releases/latest/download/gh_$(curl -sSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name | sed 's/^v//')_linux_amd64.tar.gz -o gh.tar.gz
          tar -xzf gh.tar.gz
          sudo cp gh_*/bin/gh /usr/local/bin/
          gh --version

      - name: Authenticate gh CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Get linked issue numbers
        id: get_issues
        run: |
          PR_ID=$(gh pr view ${{ inputs.pr_number }} --json id -q .id)

          QUERY='query($id: ID!) { node(id: $id) { ... on PullRequest { closingIssuesReferences(first: 10) { nodes { number id } } } } }'
          gh api graphql -f id="$PR_ID" -f query="$QUERY" > pr_issues.json

          jq -r '.data.node.closingIssuesReferences.nodes[] | "\(.number),\(.id)"' pr_issues.json > issues.csv

          echo "issue_list<<EOF" >> $GITHUB_OUTPUT
          cat issues.csv >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Find the latest matching project v2
        id: project
        run: |
          PREFIX="${{ inputs.project_name_prefix }}"
          gh api graphql -f query='{
            organization(login: "TransactionProcessing") {
              projectsV2(first: 100) {
                nodes {
                  id title url createdAt
                }
              }
            }
          }' > all_projects.json

          jq --arg prefix "$PREFIX" '.data.organization.projectsV2.nodes | map(select(.title | startswith($prefix))) | sort_by(.createdAt) | reverse | .[0] | { title, id }' all_projects.json > latest_project.json

          echo "project_id=$(jq -r '.id' latest_project.json)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Get "Status" field ID and option ID
        id: status_field
        run: |
          PROJECT_ID=${{ steps.project.outputs.project_id }}
          FIELD_NAME="Status"
          STATUS_OPTION_NAME="${{ inputs.project_column_name }}"

          gh api graphql -f query='query($projectId: ID!) {
            node(id: $projectId) {
              ... on ProjectV2 {
                fields(first: 100) {
                  nodes {
                    ... on ProjectV2SingleSelectField {
                      id name options { id name }
                    }
                  }
                }
              }
            }
          }' -f projectId="$PROJECT_ID" > fields.json

          FIELD_ID=$(jq -r '.data.node.fields.nodes[] | select(.name == "'$FIELD_NAME'") | .id' fields.json)
          OPTION_ID=$(jq -r '.data.node.fields.nodes[] | select(.name == "'$FIELD_NAME'") | .options[] | select(.name == "'$STATUS_OPTION_NAME'") | .id' fields.json)

          if [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "Could not find field or option IDs"
            exit 1
          fi

          echo "field_id=$FIELD_ID" >> $GITHUB_OUTPUT
          echo "option_id=$OPTION_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Map issues to project item IDs
        id: map_items
        run: |
          PROJECT_ID=${{ steps.project.outputs.project_id }}
          echo "item_ids=" >> $GITHUB_OUTPUT
          > item_ids.txt

          while IFS=',' read -r ISSUE_NUMBER ISSUE_NODE_ID; do
            echo "🔍 Mapping issue #$ISSUE_NUMBER"
            HAS_NEXT_PAGE=true
            END_CURSOR=""

            while [ "$HAS_NEXT_PAGE" = "true" ]; do
              if [ -n "$END_CURSOR" ]; then
                PAGINATION=", after: \\\"$END_CURSOR\\\""
              else
                PAGINATION=""
              fi

              QUERY=$(cat <<'GRAPHQL'
              query {
                node(id: "REPLACE_PROJECT_ID") {
                  ... on ProjectV2 {
                    items(first: 100REPLACE_PAGINATION) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                            number
                          }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }
              GRAPHQL
              )

              # Replace placeholders with actual values
              QUERY=${QUERY//REPLACE_PROJECT_ID/$PROJECT_ID}
              QUERY=${QUERY//REPLACE_PAGINATION/$PAGINATION}

              RESPONSE=$(gh api graphql -f query="$QUERY")
              echo "$RESPONSE" > items.json

              if jq -e '.data.node.items.nodes' items.json > /dev/null; then
                MATCHED_ITEM_ID=$(jq -r --arg ISSUE_NODE_ID "$ISSUE_NODE_ID" '
                  .data.node.items.nodes[]
                  | select(.content.id == $ISSUE_NODE_ID)
                  | .id' items.json)

                if [ -n "$MATCHED_ITEM_ID" ]; then
                  echo "✅ Found item ID: $MATCHED_ITEM_ID for issue $ISSUE_NUMBER"
                  echo "$MATCHED_ITEM_ID" >> item_ids.txt
                fi
              else
                echo "⚠️ No items found for project."
              fi

              HAS_NEXT_PAGE=$(jq -r '.data.node.items.pageInfo.hasNextPage' items.json)
              END_CURSOR=$(jq -r '.data.node.items.pageInfo.endCursor' items.json)
            done
          done < issues.csv

          echo "item_ids<<EOF" >> $GITHUB_OUTPUT
          cat item_ids.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Set Status field to selected value
        run: |
          FIELD_ID=${{ steps.status_field.outputs.field_id }}
          OPTION_ID=${{ steps.status_field.outputs.option_id }}
          PROJECT_ID=${{ steps.project.outputs.project_id }}

          while IFS='=' read -r ISSUE_NUM ITEM_ID; do
            echo "Setting status for issue #$ISSUE_NUM (item_id: $ITEM_ID)"

            gh api graphql -f query='mutation($input: UpdateProjectV2ItemFieldValueInput!) {
              updateProjectV2ItemFieldValue(input: $input) {
                projectV2Item {
                  id
                }
              }
            }' -f input="{\"projectId\":\"$PROJECT_ID\",\"itemId\":\"$ITEM_ID\",\"fieldId\":\"$FIELD_ID\",\"value\":{\"singleSelectOptionId\":\"$OPTION_ID\"}}"

          done < issue_items.env
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
