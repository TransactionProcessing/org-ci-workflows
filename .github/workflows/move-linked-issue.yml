name: Move Linked Issues to Project Column

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      project_column_name:
        required: true
        type: string
      project_name_prefix:
        required: false
        default: ''
        type: string
    secrets:
      gh_token:
        required: true

jobs:
  move-linked-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2
        
      - name: Install GitHub CLI
        run: |
          curl -sSL https://github.com/cli/cli/releases/latest/download/gh_$(curl -sSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name | sed 's/^v//')_linux_amd64.tar.gz -o gh.tar.gz
          tar -xzf gh.tar.gz
          sudo cp gh_*/bin/gh /usr/local/bin/
          gh --version

      - name: Authenticate gh CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Get linked issue numbers
        id: get_issues
        run: |
          PR_ID=$(gh pr view ${{ inputs.pr_number }} --json id -q .id)

          QUERY='
          query($id: ID!) {
            node(id: $id) {
              ... on PullRequest {
                closingIssuesReferences(first: 10) {
                  nodes {
                    number
                    id
                  }
                }
              }
            }
          }'

          gh api graphql -f id="$PR_ID" -f query="$QUERY" > pr_issues.json

          jq -r '.data.node.closingIssuesReferences.nodes[] | "\(.number),\(.id)"' pr_issues.json > issues.csv

          echo "issue_list<<EOF" >> $GITHUB_OUTPUT
          cat issues.csv >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: List all Projects v2 in the organization
        run: |
          gh api graphql -f query='
            {
              organization(login: "TransactionProcessing") {
                projectsV2(first: 100) {
                  nodes {
                    id
                    title                  
                    url
                  }
                }
              }
            }' --paginate
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Find the latest matching project v2
        id: project
        run: |
          PREFIX="${{ inputs.project_name_prefix }}"
      
          # Query all org projects v2
          gh api graphql -f query='
            {
              organization(login: "TransactionProcessing") {
                projectsV2(first: 100) {
                  nodes {
                    id
                    title
                    url
                    createdAt
                  }
                }
              }
            }' > all_projects.json
      
          # Filter projects matching prefix and sort by creation date descending
          jq --arg prefix "$PREFIX" '
            .data.organization.projectsV2.nodes
            | map(select(.title | startswith($prefix)))
            | sort_by(.createdAt)
            | reverse
            | .[0] 
            | { title, id }
          ' all_projects.json > latest_project.json
      
          PROJECT_NAME=$(jq -r '.title' latest_project.json)
          PROJECT_ID=$(jq -r '.id' latest_project.json)
      
          echo "Project v2: $PROJECT_NAME ($PROJECT_ID)"
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: List all single-select fields in the project
        run: |
          PROJECT_ID=${{ steps.project.outputs.project_id }}
      
          echo "🔍 Listing all single-select fields for project ID: $PROJECT_ID"
      
          gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 100) {
                    nodes {
                      __typename
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID" | jq .
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Get "Status" field ID
        id: status_field
        run: |
          PROJECT_ID=${{ steps.project.outputs.project_id }}
          FIELD_NAME="Status"
      
          QUERY=$(cat <<EOF
          query {
            node(id: "$PROJECT_ID") {
              ... on ProjectV2 {
                fields(first: 100) {
                  nodes {
                    ... on ProjectV2SingleSelectField {
                      id
                      name
                    }
                    ... on ProjectV2FieldCommon {
                      id
                      name
                    }
                  }
                }
              }
            }
          }
          EOF
          )
      
          echo "Running GraphQL query..."
          response=$(gh api graphql -f query="$QUERY")
          echo "$response" | jq .
      
          FIELD_ID=$(echo "$response" | jq -r '.data.node.fields.nodes[] | select(.name == "'"$FIELD_NAME"'") | .id')
      
          if [ -z "$FIELD_ID" ]; then
            echo "Could not find the field ID for '$FIELD_NAME'."
            exit 1
          fi
      
          echo "field_id=$FIELD_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Get option ID for selected status value
        id: status_option
        run: |
          FIELD_ID=${{ steps.status_field.outputs.field_id }}
          STATUS_OPTION_NAME="${{ inputs.status_option_name }}"  # e.g., "In Progress"
      
          QUERY=$(cat <<EOF
          query {
            node(id: "$FIELD_ID") {
              ... on ProjectV2SingleSelectField {
                options {
                  id
                  name
                }
              }
            }
          }
          EOF
          )
      
          echo "Running GraphQL query for field options..."
          response=$(gh api graphql -f query="$QUERY")
          echo "$response" | jq .
      
          OPTION_ID=$(echo "$response" | jq -r '.data.node.options[] | select(.name == "'"$STATUS_OPTION_NAME"'") | .id')
      
          if [ -z "$OPTION_ID" ]; then
            echo "Could not find the option ID for '$STATUS_OPTION_NAME'."
            exit 1
          fi
      
          echo "option_id=$OPTION_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

          
      - name: Set Status field to selected value
        run: |
          PROJECT_ID=${{ steps.project.outputs.project_id }}
          FIELD_ID=${{ steps.status_field.outputs.field_id }}
          OPTION_ID=${{ steps.status_field.outputs.option_id }}
          STATUS_OPTION_NAME="${{ inputs.project_column_name }}"
      
          echo "Setting status field to: $STATUS_OPTION_NAME (Field ID: $FIELD_ID, Option ID: $OPTION_ID)"
      
          # Check if the field_id and option_id are present
          if [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "Field ID or Option ID not found."
            exit 1
          fi
      
          # GraphQL query to update status field to the selected value
          QUERY=$(cat <<EOF
          mutation {
            updateProjectV2ItemFieldValue(input: {
              projectId: "$PROJECT_ID"
              fieldId: "$FIELD_ID"
              itemId: "$ITEM_ID"  # Assuming ITEM_ID is passed correctly from previous steps
              value: { id: "$OPTION_ID" }
            }) {
              clientMutationId
            }
          }
          EOF
          )
      
          # Send the GraphQL request to set the status
          response=$(gh api graphql -f query="$QUERY" -H "Accept: application/vnd.github.v3+json")
      
          echo "Response: $response"
      
        env:
          GH_TOKEN: ${{ secrets.gh_token }}



