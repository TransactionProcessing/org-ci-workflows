name: Move Linked Issues to Project Column

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      project_column_name:
        required: true
        type: string
      project_name_prefix:
        required: false
        default: ''
        type: string
    secrets:
      gh_token:
        required: true

jobs:
  move-linked-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2
        
      - name: Install GitHub CLI
        run: |
          curl -sSL https://github.com/cli/cli/releases/latest/download/gh_$(curl -sSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name | sed 's/^v//')_linux_amd64.tar.gz -o gh.tar.gz
          tar -xzf gh.tar.gz
          sudo cp gh_*/bin/gh /usr/local/bin/
          gh --version

      - name: Authenticate gh CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Get linked issue numbers
        id: get_issues
        run: |
          PR_ID=$(gh pr view ${{ inputs.pr_number }} --json id -q .id)

          QUERY='
          query($id: ID!) {
            node(id: $id) {
              ... on PullRequest {
                closingIssuesReferences(first: 10) {
                  nodes {
                    number
                    id
                  }
                }
              }
            }
          }'

          gh api graphql -f id="$PR_ID" -f query="$QUERY" > pr_issues.json

          jq -r '.data.node.closingIssuesReferences.nodes[] | "\(.number),\(.id)"' pr_issues.json > issues.csv

          echo "issue_list<<EOF" >> $GITHUB_OUTPUT
          cat issues.csv >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: List all Projects v2 in the organization
        run: |
          gh api graphql -f query='
            {
              organization(login: "TransactionProcessing") {
                projectsV2(first: 100) {
                  nodes {
                    id
                    title                  
                    url
                  }
                }
              }
            }' --paginate
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Find the latest matching project v2
        id: project
        run: |
          PREFIX="${{ inputs.project_name_prefix }}"
      
          # Query all org projects v2
          gh api graphql -f query='
            {
              organization(login: "TransactionProcessing") {
                projectsV2(first: 100) {
                  nodes {
                    id
                    title
                    url
                    createdAt
                  }
                }
              }
            }' > all_projects.json
      
          # Filter projects matching prefix and sort by creation date descending
          jq --arg prefix "$PREFIX" '
            .data.organization.projectsV2.nodes
            | map(select(.title | startswith($prefix)))
            | sort_by(.createdAt)
            | reverse
            | .[0] 
            | { title, id }
          ' all_projects.json > latest_project.json
      
          PROJECT_NAME=$(jq -r '.title' latest_project.json)
          PROJECT_ID=$(jq -r '.id' latest_project.json)
      
          echo "Project v2: $PROJECT_NAME ($PROJECT_ID)"
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: List all single-select fields in the project
        run: |
          PROJECT_ID=${{ steps.project.outputs.project_id }}
      
          echo "🔍 Listing all single-select fields for project ID: $PROJECT_ID"
      
          gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 100) {
                    nodes {
                      __typename
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID" | jq .
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          
      - name: Set Status field to selected value
        run: |
          PROJECT_ID=${{ steps.project.outputs.project_id }}
          FIELD_NAME="Status"  # The field name (can be parameterized if needed)
          STATUS_OPTION_NAME="${{ inputs.status_option_name }}"  # The status value to set (e.g., "In Progress")
      
          echo "🔍 Retrieving Status field and its options"
      
          # Get the Status field ID and the option ID for the selected status
          RESPONSE=$(gh api graphql -f query='
            query($projectId: ID!, $fieldName: String!, $statusOptionName: String!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 100) {
                    nodes {
                      __typename
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID" -f fieldName="$FIELD_NAME" -f statusOptionName="$STATUS_OPTION_NAME")
      
          echo "🎯 Response: $RESPONSE"
      
          # Extract the field ID and option ID from the response
          FIELD_ID=$(echo "$RESPONSE" | jq -r '.data.node.fields.nodes[] | select(.name == "'"$FIELD_NAME"'") | .id')
          OPTION_ID=$(echo "$RESPONSE" | jq -r '.data.node.fields.nodes[] | select(.name == "'"$FIELD_NAME"'") | .options[] | select(.name == "'"$STATUS_OPTION_NAME"'") | .id')
      
          if [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "❌ Could not find field or option IDs."
            exit 1
          fi
      
          echo "✅ Found Field ID: $FIELD_ID, Option ID for '$STATUS_OPTION_NAME': $OPTION_ID"
      
          # Get the issue IDs (e.g., from a previous step)
          ISSUE_LIST="${{ steps.get_issues.outputs.issue_list }}"
      
          echo "🔄 Updating issues status"
      
          # Loop through the issue list and update the status
          while IFS=',' read -r issue_number issue_id; do
            echo "➡️ Setting status for issue #$issue_number to '$STATUS_OPTION_NAME'"
      
            # Update the status field to the selected option
            gh api graphql -f query='
              mutation($itemId: ID!, $fieldId: ID!, $optionId: ID!) {
                updateProjectV2ItemFieldValue(input: {projectV2ItemId: $itemId, fieldId: $fieldId, value: {singleSelectOptionId: $optionId}}) {
                  projectV2Item {
                    id
                  }
                }
              }' -f itemId="$issue_id" -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID"
      
          done <<< "$ISSUE_LIST"
        env:
          GH_TOKEN: ${{ secrets.gh_token }}


