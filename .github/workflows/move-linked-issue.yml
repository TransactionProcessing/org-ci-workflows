name: Move Linked Issues to Project Column

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      project_column_name:
        required: true
        type: string
      project_name_prefix:
        required: false
        default: ''
        type: string
    secrets:
      gh_token:
        required: true

jobs:
  move-linked-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2
        
      - name: Install GitHub CLI
        run: |
          curl -sSL https://github.com/cli/cli/releases/latest/download/gh_$(curl -sSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name | sed 's/^v//')_linux_amd64.tar.gz -o gh.tar.gz
          tar -xzf gh.tar.gz
          sudo cp gh_*/bin/gh /usr/local/bin/
          gh --version

      - name: Authenticate gh CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Get linked issue numbers
        id: get_issues
        run: |
          PR_ID=$(gh pr view ${{ inputs.pr_number }} --json id -q .id)

          QUERY='
          query($id: ID!) {
            node(id: $id) {
              ... on PullRequest {
                closingIssuesReferences(first: 10) {
                  nodes {
                    number
                    id
                  }
                }
              }
            }
          }'

          gh api graphql -f id="$PR_ID" -f query="$QUERY" > pr_issues.json

          jq -r '.data.node.closingIssuesReferences.nodes[] | "\(.number),\(.id)"' pr_issues.json > issues.csv

          echo "issue_list<<EOF" >> $GITHUB_OUTPUT
          cat issues.csv >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: List all Projects v2 in the organization
        run: |
          gh api graphql -f query='
            {
              organization(login: "TransactionProcessing") {
                projectsV2(first: 100) {
                  nodes {
                    id
                    title                  
                    url
                  }
                }
              }
            }' --paginate
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Find the latest matching project v2
        id: project
        run: |
          PREFIX="${{ inputs.project_name_prefix }}"
      
          # Query all org projects v2
          gh api graphql -f query='
            {
              organization(login: "TransactionProcessing") {
                projectsV2(first: 100) {
                  nodes {
                    id
                    title
                    url
                    createdAt
                  }
                }
              }
            }' > all_projects.json
      
          # Filter projects matching prefix and sort by creation date descending
          jq --arg prefix "$PREFIX" '
            .data.organization.projectsV2.nodes
            | map(select(.title | startswith($prefix)))
            | sort_by(.createdAt)
            | reverse
            | .[0] 
            | { title, id }
          ' all_projects.json > latest_project.json
      
          PROJECT_NAME=$(jq -r '.title' latest_project.json)
          PROJECT_ID=$(jq -r '.id' latest_project.json)
      
          echo "Project v2: $PROJECT_NAME ($PROJECT_ID)"
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Get "Status" field ID and "In Progress" option ID
        id: status_field
        run: |
          PROJECT_ID=${{ steps.project.outputs.project_id }}
          FIELD_NAME="Status"
          STATUS_OPTION_NAME="${{ inputs.project_column_name }}"

          # Get field ID for "Status" field
          gh api projects/v2/fields --paginate --jq '.[] | select(.name == "'"$FIELD_NAME"'") | .id' > field_id.txt
          FIELD_ID=$(cat field_id.txt)

          # Get option ID for "In Progress" (or specified column name)
          gh api projects/v2/fields/$FIELD_ID/options --paginate --jq '.[] | select(.name == "'"$STATUS_OPTION_NAME"'") | .id' > option_id.txt
          OPTION_ID=$(cat option_id.txt)

          if [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "Could not find field or option IDs."
            exit 1
          fi

          echo "field_id=$FIELD_ID" >> $GITHUB_OUTPUT
          echo "option_id=$OPTION_ID" >> $GITHUB_OUTPUT

      - name: Move issues to project and set status
        run: |
          PROJECT_ID=${{ steps.project.outputs.project_id }}
          FIELD_ID=${{ steps.status_field.outputs.field_id }}
          OPTION_ID=${{ steps.status_field.outputs.option_id }}

          while IFS=',' read -r issue_number issue_id; do
            echo "Adding issue #$issue_number to project $PROJECT_ID and setting status to $OPTION_ID"
            # Add issue to project
            gh api projects/v2/items --paginate -X POST -f project_id="$PROJECT_ID" -f content_id="$issue_id" -f content_type="Issue"

            # Set the "Status" field to "In Progress"
            gh api projects/v2/items --paginate -X PATCH -f item_id="$issue_id" -f field_id="$FIELD_ID" -f value_id="$OPTION_ID"
          done <<< "${{ steps.get_issues.outputs.issue_list }}"
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
