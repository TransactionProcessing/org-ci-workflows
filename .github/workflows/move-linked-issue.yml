name: Move Linked Issues to Project Column

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      project_column_name:
        required: true
        type: string
      project_name_prefix:
        required: false
        default: ''
        type: string
    secrets:
      gh_token:
        required: true

jobs:
  move-linked-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2
        
      - name: Install GitHub CLI
        run: |
          curl -sSL https://github.com/cli/cli/releases/latest/download/gh_$(curl -sSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name | sed 's/^v//')_linux_amd64.tar.gz -o gh.tar.gz
          tar -xzf gh.tar.gz
          sudo cp gh_*/bin/gh /usr/local/bin/
          gh --version

      - name: Authenticate gh CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Get linked issue numbers
        id: get_issues
        run: |
          PR_ID=$(gh pr view ${{ inputs.pr_number }} --json id -q .id)

          QUERY='
          query($id: ID!) {
            node(id: $id) {
              ... on PullRequest {
                closingIssuesReferences(first: 10) {
                  nodes {
                    number
                    id
                  }
                }
              }
            }
          }'

          gh api graphql -f id="$PR_ID" -f query="$QUERY" > pr_issues.json

          jq -r '.data.node.closingIssuesReferences.nodes[] | "\(.number),\(.id)"' pr_issues.json > issues.csv

          echo "issue_list<<EOF" >> $GITHUB_OUTPUT
          cat issues.csv >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: List all Projects v2 in the organization
        run: |
          gh api graphql -f query='
            {
              organization(login: "TransactionProcessing") {
                projectsV2(first: 100) {
                  nodes {
                    id
                    title                  
                    url
                  }
                }
              }
            }' --paginate
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Find the latest matching project v2
        id: project
        run: |
          PREFIX="${{ inputs.project_name_prefix }}"
      
          # Query all org projects v2
          gh api graphql -f query='
            {
              organization(login: "TransactionProcessing") {
                projectsV2(first: 100) {
                  nodes {
                    id
                    title
                    url
                    createdAt
                  }
                }
              }
            }' > all_projects.json
      
          # Filter projects matching prefix and sort by creation date descending
          jq --arg prefix "$PREFIX" '
            .data.organization.projectsV2.nodes
            | map(select(.title | startswith($prefix)))
            | sort_by(.createdAt)
            | reverse
            | .[0] 
            | { title, id }
          ' all_projects.json > latest_project.json
      
          PROJECT_NAME=$(jq -r '.title' latest_project.json)
          PROJECT_ID=$(jq -r '.id' latest_project.json)
      
          echo "Project v2: $PROJECT_NAME ($PROJECT_ID)"
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Get "Status" field ID and "In Progress" option ID
        id: status_field
        run: |
          PROJECT_ID=${{ steps.project.outputs.project_id }}
          FIELD_NAME="Status"
          STATUS_OPTION_NAME="${{ inputs.project_column_name }}"
      
          # Query for the "Status" field ID
          FIELD_ID=$(gh api graphql -f query='
            query($projectId: ID!, $fieldName: String!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 100) {
                    nodes {
                      id
                      name
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID" -f fieldName="$FIELD_NAME" | jq -r '.data.node.fields.nodes[] | select(.name == "'"$FIELD_NAME"'") | .id')
      
          if [ -z "$FIELD_ID" ]; then
            echo "Could not find the field ID for '$FIELD_NAME'."
            exit 1
          fi
      
          # Query for the "In Progress" option ID (or the specified column name) for the "Status" field
          OPTION_ID=$(gh api graphql -f query='
            query($fieldId: ID!, $optionName: String!) {
              node(id: $fieldId) {
                ... on ProjectV2Field {
                  options(first: 100) {
                    nodes {
                      id
                      name
                    }
                  }
                }
              }
            }' -f fieldId="$FIELD_ID" -f optionName="$STATUS_OPTION_NAME" | jq -r '.data.node.options.nodes[] | select(.name == "'"$STATUS_OPTION_NAME"'") | .id')
      
          if [ -z "$OPTION_ID" ]; then
            echo "Could not find the option ID for '$STATUS_OPTION_NAME'."
            exit 1
          fi
      
          echo "field_id=$FIELD_ID" >> $GITHUB_OUTPUT
          echo "option_id=$OPTION_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

          
      - name: Update status field for issues in project
        run: |
          PROJECT_ID=${{ steps.project.outputs.project_id }}
          FIELD_ID=${{ steps.status_field.outputs.field_id }}
          OPTION_ID=${{ steps.status_field.outputs.option_id }}
      
          while IFS=',' read -r issue_number issue_node_id; do
            echo "Finding item ID in project for issue #$issue_number (Node ID: $issue_node_id)..."
      
            ITEM_ID=$(gh api graphql -f query='
              query($project: ID!, $content: ID!) {
                node(id: $project) {
                  ... on ProjectV2 {
                    items(first: 100, filterBy: {contentId: $content}) {
                      nodes {
                        id
                      }
                    }
                  }
                }
              }' -f project="$PROJECT_ID" -f content="$issue_node_id" | jq -r '.data.node.items.nodes[0].id')
      
            if [[ -z "$ITEM_ID" || "$ITEM_ID" == "null" ]]; then
              echo "❌ Could not find project item for issue #$issue_number"
              continue
            fi
      
            echo "✅ Found item ID: $ITEM_ID. Updating status field..."
      
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: ID!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project,
                  itemId: $item,
                  fieldId: $field,
                  value: {
                    singleSelectOptionId: $option
                  }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$FIELD_ID" -f option="$OPTION_ID"
      
            echo "✅ Status updated for item $ITEM_ID"
          done <<< "${{ steps.get_issues.outputs.issue_list }}"
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

