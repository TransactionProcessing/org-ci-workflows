name: Move Linked Issues to Project Column

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      project_column_name:
        required: true
        type: string
      project_name_prefix:
        required: false
        default: ''
        type: string
    secrets:
      gh_token:
        required: true

jobs:
  move-linked-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Install GitHub CLI
        run: |
          curl -sSL https://github.com/cli/cli/releases/latest/download/gh_$(curl -sSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name | sed 's/^v//')_linux_amd64.tar.gz -o gh.tar.gz
          tar -xzf gh.tar.gz
          sudo cp gh_*/bin/gh /usr/local/bin/
          gh --version

      - name: Authenticate gh CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Get linked issue numbers
        id: get_issues
        run: |
          PR_ID=$(gh pr view ${{ inputs.pr_number }} --json id -q .id)

          QUERY='
          query($id: ID!) {
            node(id: $id) {
              ... on PullRequest {
                closingIssuesReferences(first: 10) {
                  nodes {
                    number
                    id
                  }
                }
              }
            }
          }'

          gh api graphql -f id="$PR_ID" -f query="$QUERY" > pr_issues.json

          jq -r '.data.node.closingIssuesReferences.nodes[] | "\(.number),\(.id)"' pr_issues.json > issues.csv

          echo "issue_list<<EOF" >> $GITHUB_OUTPUT
          cat issues.csv >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Find the latest matching project
        id: project
        run: |
          PREFIX="${{ inputs.project_name_prefix }}"
          gh api orgs/${{ github.repository_owner }}/projects --paginate --jq '.[] | select(.name | startswith("'"$PREFIX"'")) | [.name, .id]' > projects.json

          jq -r '.[0]' projects.json > latest_project.txt
          PROJECT_NAME=$(cut -d'"' -f2 latest_project.txt)
          PROJECT_ID=$(cut -d' ' -f2 latest_project.txt)

          echo "Project: $PROJECT_NAME ($PROJECT_ID)"
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Get target column ID
        id: column
        run: |
          PROJECT_ID=${{ steps.project.outputs.project_id }}
          COLUMN_NAME="${{ inputs.project_column_name }}"
          gh api projects/$PROJECT_ID/columns --paginate --jq '.[] | select(.name=="'"$COLUMN_NAME"'") | .id' > column_id.txt
          COLUMN_ID=$(cat column_id.txt)

          if [ -z "$COLUMN_ID" ]; then
            echo "Column '$COLUMN_NAME' not found!"
            exit 1
          fi

          echo "column_id=$COLUMN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.gh_token }}

      - name: Move issues to column
        run: |
          COLUMN_ID=${{ steps.column.outputs.column_id }}

          while IFS=',' read -r issue_number issue_id; do
            echo "Moving issue #$issue_number to column $COLUMN_ID"
            gh api projects/columns/$COLUMN_ID/cards -f content_id="$issue_id" -f content_type="Issue"
          done <<< "${{ steps.get_issues.outputs.issue_list }}"
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
